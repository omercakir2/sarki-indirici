[project]
name = "sarki-indirici"
version = "0.1.0"
description = "Bedava ve Reklamsız MP3 Şarkı İndirici — local YouTube to MP3 downloader"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

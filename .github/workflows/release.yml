name: Release

# Push a tag like v0.1.0 to build everything and publish a GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
# "Run workflow" from the Actions tab builds the same files without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS Apple Silicon
            asset: Sarki-Indirici-macOS-AppleSilicon.zip
          - os: macos-15-intel
            label: macOS Intel
            asset: Sarki-Indirici-macOS-Intel.zip
          - os: windows-latest
            label: Windows
            asset: Sarki-Indirici-Windows.exe
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install "fastapi>=0.115" "uvicorn>=0.32" "pywebview>=5.3" "pyinstaller>=6.10" "pillow>=10"

      - name: Fetch ffmpeg + deno, draw icon
        run: |
          python desktop/fetch_tools.py
          python desktop/make_icon.py

      - name: PyInstaller
        run: pyinstaller desktop/sarki.spec --noconfirm --workpath build --distpath dist

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Sarki Indirici.app" "${{ matrix.asset }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/Sarki-Indirici.exe "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Şarkı İndirici ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: assets/*
